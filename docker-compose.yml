version: '3.8'

services:
  db:
    image: mongo:8
    container_name: shorts-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment: &mongo-root
      MONGO_INITDB_ROOT_USERNAME: Mohsen_Dowlati
      MONGO_INITDB_ROOT_PASSWORD: I_wanna_use_a_weak_password_for_this
    volumes:
      - ./.database/:/data/db/
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener

  cache:
    image: redis:7.4-alpine
    container_name: shorts-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - url-shortener

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OpenTelemetry gRPC receiver
      - "4318:4318"   # OpenTelemetry HTTP receiver
      - "14268:14268" # Jaeger HTTP collector (legacy)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - url-shortener

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: shorts-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./Docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - url-shortener

  k6-seed:
    image: mongo:8
    profiles:
      - benchmark
    command: ["mongosh", "--nodb", "--quiet", "--file", "/scripts/seed.mongodb.js"]
    environment:
      <<: *mongo-root
      DB_NAME: "${K6_DB_NAME:-shorts}"
      MONGODB_URI: "${K6_MONGODB_URI:-}"
      ORIGINAL_URL: "${K6_TARGET_URL:-https://example.com}"
    volumes:
      - ./Docker/k6:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - url-shortener

  k6-benchmark:
    image: grafana/k6:2.3.0
    profiles:
      - benchmark
    command: ["run", "/scripts/benchmark.js"]
    environment:
      BASE_URL: "${K6_BASE_URL:-http://host.docker.internal:8080}"
      ORIGINAL_URL: "${K6_TARGET_URL:-https://example.com}"
      ACCESS_TOKEN: "${K6_ACCESS_TOKEN:-}"
      PEAK_RPS: "${K6_PEAK_RPS:-12000}"
      PREALLOCATED_VUS: "${K6_PREALLOCATED_VUS:-512}"
      MAX_VUS: "${K6_MAX_VUS:-4096}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Docker/k6:/scripts:ro
    depends_on:
      k6-seed:
        condition: service_completed_successfully
    networks:
      - url-shortener

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - loadtest
    command: ["run", "/scripts/smoke.js"]
    environment:
      BASE_URL: "${K6_BASE_URL:-http://host.docker.internal:8080}"
      REDIRECT_CODE: "${K6_REDIRECT_CODE:-}"
      K6_VUS: "${K6_VUS:-1}"
      K6_DURATION: "${K6_DURATION:-30s}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Docker/k6:/scripts:ro
    networks:
      - url-shortener

  grafana:
    image: grafana/grafana:11.1.0
    container_name: shorts-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=Mohsen_Dowlati
      - GF_SECURITY_ADMIN_PASSWORD=Weaved_poems_for_m
    volumes:
      - ./Docker/datasource.yml:/etc/Docker/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - url-shortener

volumes:
  prom_data:

networks:
  url-shortener:
    driver: bridge
